<script>
function showSection(sectionId, button) {
  document.querySelectorAll('.section').forEach(section => {
    section.classList.remove('active');
  });

  const section = document.getElementById(sectionId);

  if (section) {
    section.classList.add('active');
  }

  document.querySelectorAll('.nav-btn').forEach(nav => {
    nav.classList.remove('active');
  });

  if (button) {
    button.classList.add('active');
  }
}

function showSignup() {
  showSection('signup');

  document.getElementById('authTitle').textContent =
    'Create your account';

  document.getElementById('authSubtitle').textContent =
    'Join IDAN Connect and meet people worldwide.';

  document.getElementById('nameGroup').style.display = 'block';
  document.getElementById('profileFields').style.display = 'block';

  document.getElementById('authSubmit').textContent =
    'Create Account';

  document.getElementById('signupMessage').textContent = '';
}

function showSignin() {
  showSection('signup');

  document.getElementById('authTitle').textContent =
    'Welcome back';

  document.getElementById('authSubtitle').textContent =
    'Sign in to your IDAN Connect account.';

  document.getElementById('nameGroup').style.display = 'none';
  document.getElementById('profileFields').style.display = 'none';

  document.getElementById('authSubmit').textContent = 'Sign In';

  document.getElementById('signupMessage').textContent =
    'Online sign-in will be enabled after authentication is connected.';
}

function passProfile() {
  document.getElementById('message').textContent =
    'You passed this sample profile.';
}

function likeProfile() {
  document.getElementById('message').textContent =
    'You liked this sample profile.';
}

document.getElementById('signupForm').addEventListener(
  'submit',
  function(event) {
    event.preventDefault();

    document.getElementById('signupMessage').textContent =
      'The form works, but online account creation still needs Firebase Authentication.';
  }
);
</script>

</body>
</html>
